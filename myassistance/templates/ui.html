  <style>
  :root {
    --bg-color: #ffffff;
    --text-color: #000000;
    --header-bg: #020108;
    --user-msg-bg: #dfe6e9;
    --bot-msg-bg: #ecf0f1;
    --input-bg: #ffffff;
    --input-border: #ccc;
    --button-color: #000;
  }

  .dark-mode {
    --bg-color: #121212;
    --text-color: #ffffff;
    --header-bg: #1e1e1e;
    --user-msg-bg: #2e2e2e;
    --bot-msg-bg: #3a3a3a;
    --input-bg: #1c1c1c;
    --input-border: #555;
    --button-color: #ffffff;
  }

  body {
    background-color: var(--bg-color);
    color: var(--text-color);
    font-family: 'Segoe UI', sans-serif;
    margin: 0;
    height: 100%;
  }

  .chat-header {
    background-color: var(--header-bg);
    color: var(--text-color);
    padding: 1rem;
    font-size: 1.2rem;
    font-weight: 500;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
  }

  .chat-body {
    flex: 1;
    overflow-y: auto;
    padding: 1rem;
    background-color: var(--bg-color);
  }

  .chat-container {
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .chat-msg {
    margin-bottom: 1rem;
    padding: 0.75rem 1rem;
    border-radius: 1.25rem;
    max-width: 85%;
    word-wrap: break-word;
  }

  .user-msg {
    background-color: var(--user-msg-bg);
    align-self: flex-end;
    text-align: right;
    margin-left: auto;
    color: var(--text-color);
  }

  background: none !important;  /* Remove background */

}

<body>

<p style="font-size: 0.9rem; color: grey; padding: 0.75rem; font-family: 'Arial Narrow', Arial, sans-serif;"><b>Logged in as </b><strong><b>{{E}}</b></strong></p>
<div class="chat-header d-flex justify-content-between align-items-center px-3">

</div>


<div class="chat-container">
  <div class="chat-header w-100">
    <button onclick="toggleDarkMode()" class="btn btn-sm btn-outline-secondary text-light"><i class="bi bi-circle-half"> Change theme</i></button>
    <span style="color: white;"> {% if U %} Hello {{U}}, How Can I Assist You Today?</span> {% endif %}
    <button onclick="clearChat()" class="btn btn-sm">Clear Chat</button>
  </div>

  <div class="chat-body" id="chatBody"></div>

  <div class="chat-input">
    <input type="text" id="userInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendMessage()">
    <button class="btn" onclick="sendMessage()"><i style="font-size: 33px;" class="bi bi-arrow-up-circle-fill"></i></button>
  </div>
</div>

<script>
  async function sendMessage() {
    const input = document.getElementById("userInput");
    const message = input.value.trim();
    if (!message) return;

    appendMessage(message, 'user');
    input.value = "";

    const sendBtn = document.querySelector('.chat-input button');
    sendBtn.disabled = true;

    appendMessage("Typing...", 'bot');

    try {
      const response = await fetch("/chatbot/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message })
      });

      const data = await response.json();
      const chatBody = document.getElementById("chatBody");
      const tempTyping = chatBody.querySelector(".bot-msg:last-child");
      if (tempTyping && tempTyping.textContent === "Typing...") {
        chatBody.removeChild(tempTyping);
      }

      appendMessage(data.reply, 'bot');
    } catch {
      appendMessage("Sorry, something went wrong.", 'bot');
    } finally {
      sendBtn.disabled = false;
    }
  }

  function appendMessage(text, type) {
    const chatBody = document.getElementById("chatBody");
    const msg = document.createElement("div");
    msg.className = `chat-msg ${type === 'user' ? 'user-msg' : 'bot-msg'}`;
    msg.textContent = text;
    chatBody.appendChild(msg);
    chatBody.scrollTop = chatBody.scrollHeight;
  }

  function clearChat() {
    document.getElementById("chatBody").innerHTML = "";
  }

  window.onload = () => document.getElementById("userInput").focus();
</script>


<!-- mod -->
<script>
  const isDarkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  if (isDarkMode) {
    document.documentElement.classList.add('dark-mode');
  }

  // Optional: Listen for changes dynamically
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
    if (e.matches) {
      document.documentElement.classList.add('dark-mode');
    } else {
      document.documentElement.classList.remove('dark-mode');
    }
  });
</script>

<script>
  // Set dark mode if user prefers
  if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
    document.documentElement.classList.add('dark-mode');
  }

  // Listen to system theme changes
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
    if (e.matches) {
      document.documentElement.classList.add('dark-mode');
    } else {
      document.documentElement.classList.remove('dark-mode');
    }
  });

  // Toggle manually
  function toggleDarkMode() {
    document.documentElement.classList.toggle("dark-mode");
    const mode = document.documentElement.classList.contains("dark-mode") ? "dark" : "light";
    localStorage.setItem("mode", mode);
  }

  // Load saved mode
  window.onload = () => {
    const savedMode = localStorage.getItem("mode");
    if (savedMode === "dark") {
      document.documentElement.classList.add("dark-mode");
    }
    document.getElementById("userInput").focus();
  };
</script>



</body>
